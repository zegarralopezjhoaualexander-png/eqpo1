<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Integrantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="info-panel">
        <div class="info-header">
            <div>
                <div class="info-kicker">🏐 Miembros del Equipo</div>
                <h1 id="info-title">Lista de Integrantes</h1>
            </div>
            <button id="info-toggle" aria-label="Expandir información" aria-expanded="false">
                <span id="info-icon">+</span>
            </button>
        </div>

        <div id="info-body">
            <p id="info-copy">
                Nómina oficial de jugadores confirmados para la competición.
            </p>

            <div class="info-grid">
                <div class="info-row">
                    <span>Capitán</span>
                    <strong id="member-1">Jhaou Alexander Zegarra lopez</strong>
                </div>
                <div class="info-row">
                    <span>Atacante</span>
                    <strong id="member-2">Sofía Ramírez</strong>
                </div>
                <div class="info-row">
                    <span>Defensa</span>
                    <strong id="member-3">Mateo Torres</strong>
                </div>
                <div class="info-row">
                    <span>Suplente</span>
                    <strong id="member-4">Lucía Gómez</strong>
                </div>
            </div>

            <button class="btn-inscribir">Añadir Integrante</button>
        </div>
    </div>

</body>
</html>
